name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, upload
        uses: withastro/action@v6
        with:
          package-manager: bun

  # Rebuilds independently of `build` (which only uploads the Pages
  # artifact) so the parity suite runs against a real dist/ — build and test
  # are not redundant, do not collapse them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun run check

  deploy:
    # Pull requests only need build+test as a merge gate; only a push to
    # main (or a manual dispatch) should ever publish to production.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
